<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 470" width="100%" height="470" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="about-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#0D1630"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="about-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#00F2FE" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#FF354F" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#247BFF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="about-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E172E"/>
      <stop offset="100%" stop-color="#0B1226"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="about-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247BFF"/>
      <stop offset="100%" stop-color="#FF354F"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="about-dot-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#247BFF" fill-opacity="0.12"/>
    </pattern>

    <!-- Ambient Glow Filter -->
    <filter id="about-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <style>
    <![CDATA[
    .about-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .about-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
    }

    /* Carousel Animation: 4 Slides cycling smoothly across 16 seconds */
    @keyframes about-slide-1 {
      0%, 22% { opacity: 1; transform: translateY(0px); visibility: visible; }
      25%, 97% { opacity: 0; transform: translateY(12px); visibility: hidden; }
      100% { opacity: 1; transform: translateY(0px); visibility: visible; }
    }
    @keyframes about-slide-2 {
      0%, 22% { opacity: 0; transform: translateY(12px); visibility: hidden; }
      25%, 47% { opacity: 1; transform: translateY(0px); visibility: visible; }
      50%, 100% { opacity: 0; transform: translateY(12px); visibility: hidden; }
    }
    @keyframes about-slide-3 {
      0%, 47% { opacity: 0; transform: translateY(12px); visibility: hidden; }
      50%, 72% { opacity: 1; transform: translateY(0px); visibility: visible; }
      75%, 100% { opacity: 0; transform: translateY(12px); visibility: hidden; }
    }
    @keyframes about-slide-4 {
      0%, 72% { opacity: 0; transform: translateY(12px); visibility: hidden; }
      75%, 97% { opacity: 1; transform: translateY(0px); visibility: visible; }
      100% { opacity: 0; transform: translateY(12px); visibility: hidden; }
    }

    .about-s1 { animation: about-slide-1 16s ease-in-out infinite; }
    .about-s2 { animation: about-slide-2 16s ease-in-out infinite; }
    .about-s3 { animation: about-slide-3 16s ease-in-out infinite; }
    .about-s4 { animation: about-slide-4 16s ease-in-out infinite; }

    /* Indicator Pips Animation */
    @keyframes about-pip-1 {
      0%, 22% { width: 28px; fill: #247BFF; opacity: 1; }
      25%, 97% { width: 8px; fill: #334155; opacity: 0.6; }
      100% { width: 28px; fill: #247BFF; opacity: 1; }
    }
    @keyframes about-pip-2 {
      0%, 22% { width: 8px; fill: #334155; opacity: 0.6; }
      25%, 47% { width: 28px; fill: #00F2FE; opacity: 1; }
      50%, 100% { width: 8px; fill: #334155; opacity: 0.6; }
    }
    @keyframes about-pip-3 {
      0%, 47% { width: 8px; fill: #334155; opacity: 0.6; }
      50%, 72% { width: 28px; fill: #FF354F; opacity: 1; }
      75%, 100% { width: 8px; fill: #334155; opacity: 0.6; }
    }
    @keyframes about-pip-4 {
      0%, 72% { width: 8px; fill: #334155; opacity: 0.6; }
      75%, 97% { width: 28px; fill: #10B981; opacity: 1; }
      100% { width: 8px; fill: #334155; opacity: 0.6; }
    }

    .about-p1 { animation: about-pip-1 16s ease-in-out infinite; }
    .about-p2 { animation: about-pip-2 16s ease-in-out infinite; }
    .about-p3 { animation: about-pip-3 16s ease-in-out infinite; }
    .about-p4 { animation: about-pip-4 16s ease-in-out infinite; }

    /* Reduced Motion: Show a static, legible presentation */
    @media (prefers-reduced-motion: reduce) {
      .about-s1 { animation: none !important; opacity: 1 !important; transform: none !important; visibility: visible !important; }
      .about-s2, .about-s3, .about-s4 { display: none !important; }
      .about-p1 { animation: none !important; width: 28px !important; fill: #247BFF !important; }
      .about-p2, .about-p3, .about-p4 { animation: none !important; width: 8px !important; fill: #334155 !important; }
    }
    ]]>
  </style>

  <!-- Base Panel -->
  <rect x="0" y="0" width="880" height="470" rx="20" fill="url(#about-bg-grad)" stroke="url(#about-border-grad)" stroke-width="1.5"/>
  <rect x="0" y="0" width="880" height="470" rx="20" fill="url(#about-dot-grid)" opacity="0.6"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="240" r="120" fill="#247BFF" opacity="0.12" filter="url(#about-glow)"/>
  <circle cx="680" cy="240" r="120" fill="#FF354F" opacity="0.10" filter="url(#about-glow)"/>

  <!-- Header -->
  <g class="about-mono" transform="translate(45, 42)">
    <text x="0" y="0" fill="#247BFF" font-size="11" font-weight="700" letter-spacing="1.5">// 01. ABOUT &amp; DEVELOPMENT CAPABILITIES</text>
  </g>
  <g class="about-font" transform="translate(45, 72)">
    <text x="0" y="0" fill="#F8FAFC" font-size="22" font-weight="800">Bridging Thoughtful Design &amp; Modern Frontend Engineering</text>
  </g>

  <!-- ================= LEFT COLUMN: BIO AND CAPABILITIES ================= -->
  <g transform="translate(45, 96)">
    <!-- Container Card -->
    <rect x="0" y="0" width="375" height="335" rx="16" fill="url(#about-card-grad)" stroke="#1E293B" stroke-width="1.2"/>

    <!-- Inner Title -->
    <text x="24" y="34" class="about-font" fill="#E2E8F0" font-size="16" font-weight="700">Engineering Philosophy</text>
    <rect x="24" y="44" width="48" height="2.5" rx="1.2" fill="url(#about-accent-grad)"/>

    <!-- Paragraph Text -->
    <g class="about-font" fill="#94A3B8" font-size="12.5" font-weight="400">
      <text x="24" y="74">I am a Frontend Developer and UI/UX Designer driven</text>
      <text x="24" y="94">by the challenge of translating complex design systems into</text>
      <text x="24" y="114">intuitive, high-performance digital products.</text>
      <text x="24" y="142">Whether architecting React and Next.js applications or</text>
      <text x="24" y="162">fine-tuning typography and spatial hierarchy in Figma, I</text>
      <text x="24" y="182">focus on speed, accessibility, and 60fps fluidity.</text>
    </g>

    <!-- 4 Capability Badges -->
    <g class="about-font" transform="translate(20, 208)">
      <!-- Box 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="162" height="52" rx="10" fill="#111B34" stroke="#247BFF" stroke-opacity="0.3" stroke-width="1"/>
        <text x="14" y="22" fill="#38BDF8" font-size="12" font-weight="700">⚡ Responsive UI</text>
        <text x="14" y="38" fill="#94A3B8" font-size="10.5">Mobile-first &amp; fluid</text>
      </g>
      <!-- Box 2 -->
      <g transform="translate(173, 0)">
        <rect x="0" y="0" width="162" height="52" rx="10" fill="#111B34" stroke="#FF354F" stroke-opacity="0.3" stroke-width="1"/>
        <text x="14" y="22" fill="#FF8494" font-size="12" font-weight="700">🎨 Design Tokens</text>
        <text x="14" y="38" fill="#94A3B8" font-size="10.5">Figma to production</text>
      </g>
      <!-- Box 3 -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="162" height="52" rx="10" fill="#111B34" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1"/>
        <text x="14" y="22" fill="#00F2FE" font-size="12" font-weight="700">🏎️ Fast Vitals</text>
        <text x="14" y="38" fill="#94A3B8" font-size="10.5">Lighthouse 95+ score</text>
      </g>
      <!-- Box 4 -->
      <g transform="translate(173, 60)">
        <rect x="0" y="0" width="162" height="52" rx="10" fill="#111B34" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
        <text x="14" y="22" fill="#10B981" font-size="12" font-weight="700">♿ Accessible A11y</text>
        <text x="14" y="38" fill="#94A3B8" font-size="10.5">Semantic &amp; inclusive</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: ANIMATED CAROUSEL ================= -->
  <g transform="translate(440, 96)">
    <!-- Container Card -->
    <rect x="0" y="0" width="395" height="335" rx="16" fill="url(#about-card-grad)" stroke="#1E293B" stroke-width="1.2"/>

    <!-- Section Header -->
    <g class="about-font" transform="translate(24, 34)">
      <text x="0" y="0" fill="#E2E8F0" font-size="16" font-weight="700">Interests &amp; Specializations</text>
      <text x="0" y="20" fill="#64748B" font-size="11.5">Interactive rotating focus areas</text>
      <rect x="0" y="28" width="48" height="2.5" rx="1.2" fill="url(#about-accent-grad)"/>
    </g>

    <!-- Carousel Cards Container -->
    <g transform="translate(24, 76)">
      <!-- SLIDE 1: UI/UX Craftsmanship -->
      <g class="about-s1 about-font">
        <rect x="0" y="0" width="347" height="195" rx="12" fill="#111B34" stroke="#247BFF" stroke-opacity="0.4" stroke-width="1.2"/>
        <g transform="translate(20, 28)">
          <rect x="0" y="0" width="36" height="36" rx="8" fill="#247BFF" fill-opacity="0.15" stroke="#247BFF" stroke-opacity="0.35" stroke-width="1"/>
          <g transform="translate(18, 18)">
      <!-- 5-shape Figma / Design Icon -->
      <path d="M 0 -10.5 H -3.5 A 3.5 3.5 0 0 0 -3.5 -3.5 H 0 Z" fill="#F24E1E"/>
      <path d="M 0 -10.5 H 3.5 A 3.5 3.5 0 0 1 3.5 -3.5 H 0 Z" fill="#FF7262"/>
      <path d="M 0 -3.5 H -3.5 A 3.5 3.5 0 0 0 -3.5 3.5 H 0 Z" fill="#A259FF"/>
      <circle cx="3.5" cy="0" r="3.5" fill="#1ABCFE"/>
      <path d="M 0 3.5 H -3.5 A 3.5 3.5 0 0 0 0 10.5 Z" fill="#0ACF83"/>
    </g>
          <text x="48" y="16" fill="#38BDF8" font-size="11" font-weight="700" letter-spacing="1">01 // CREATIVE DISCIPLINE</text>
          <text x="48" y="34" fill="#F8FAFC" font-size="16" font-weight="700">UI/UX Craftsmanship</text>
        </g>
        <g transform="translate(20, 92)" fill="#94A3B8" font-size="12" font-weight="400">
          <text x="0" y="0">Obsessed with micro-interactions, typographic rhythm, and</text>
          <text x="0" y="20">spatial cohesion. Translating high-level product intent</text>
          <text x="0" y="40">into wireframes, interactive Figma kits, and design tokens.</text>
        </g>
        <g transform="translate(20, 160)">
          <rect x="0" y="0" width="76" height="22" rx="6" fill="#1A2748"/>
          <text x="38" y="15" text-anchor="middle" fill="#60A5FA" font-size="10.5" font-weight="600">Figma</text>
          <rect x="84" y="0" width="90" height="22" rx="6" fill="#1A2748"/>
          <text x="129" y="15" text-anchor="middle" fill="#60A5FA" font-size="10.5" font-weight="600">Wireframing</text>
          <rect x="182" y="0" width="100" height="22" rx="6" fill="#1A2748"/>
          <text x="232" y="15" text-anchor="middle" fill="#60A5FA" font-size="10.5" font-weight="600">Design Systems</text>
        </g>
      </g>

      <!-- SLIDE 2: Modern Frontend Architecture -->
      <g class="about-s2 about-font">
        <rect x="0" y="0" width="347" height="195" rx="12" fill="#111B34" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="1.2"/>
        <g transform="translate(20, 28)">
          <rect x="0" y="0" width="36" height="36" rx="8" fill="#00F2FE" fill-opacity="0.15" stroke="#00F2FE" stroke-opacity="0.35" stroke-width="1"/>
          <g transform="translate(18, 18)">
      <!-- React Atom Vector Icon -->
      <circle cx="0" cy="0" r="2.2" fill="#00F2FE"/>
      <ellipse cx="0" cy="0" rx="10" ry="3.8" fill="none" stroke="#00F2FE" stroke-width="1.8"/>
      <ellipse cx="0" cy="0" rx="10" ry="3.8" fill="none" stroke="#00F2FE" stroke-width="1.8" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="10" ry="3.8" fill="none" stroke="#00F2FE" stroke-width="1.8" transform="rotate(120)"/>
    </g>
          <text x="48" y="16" fill="#00F2FE" font-size="11" font-weight="700" letter-spacing="1">02 // ENGINEERING CORE</text>
          <text x="48" y="34" fill="#F8FAFC" font-size="16" font-weight="700">Modern Frontend Stack</text>
        </g>
        <g transform="translate(20, 92)" fill="#94A3B8" font-size="12" font-weight="400">
          <text x="0" y="0">Architecting modular component hierarchies in React and</text>
          <text x="0" y="20">Next.js. Leveraging TypeScript for ironclad types, strict</text>
          <text x="0" y="40">contracts, and seamless state-driven workflows.</text>
        </g>
        <g transform="translate(20, 160)">
          <rect x="0" y="0" width="65" height="22" rx="6" fill="#1A2748"/>
          <text x="32" y="15" text-anchor="middle" fill="#38BDF8" font-size="10.5" font-weight="600">React</text>
          <rect x="73" y="0" width="75" height="22" rx="6" fill="#1A2748"/>
          <text x="110" y="15" text-anchor="middle" fill="#38BDF8" font-size="10.5" font-weight="600">Next.js</text>
          <rect x="156" y="0" width="92" height="22" rx="6" fill="#1A2748"/>
          <text x="202" y="15" text-anchor="middle" fill="#38BDF8" font-size="10.5" font-weight="600">TypeScript</text>
        </g>
      </g>

      <!-- SLIDE 3: Interactive Motion and Polish -->
      <g class="about-s3 about-font">
        <rect x="0" y="0" width="347" height="195" rx="12" fill="#111B34" stroke="#FF354F" stroke-opacity="0.4" stroke-width="1.2"/>
        <g transform="translate(20, 28)">
          <rect x="0" y="0" width="36" height="36" rx="8" fill="#FF354F" fill-opacity="0.15" stroke="#FF354F" stroke-opacity="0.35" stroke-width="1"/>
          <g transform="translate(18, 18)">
      <!-- Animation / Motion Speed Trails + Play Arrow -->
      <path d="M -10 -5 L -4 -5 M -12 0 L -1 0 M -10 5 L -4 5" stroke="#FF8494" stroke-width="2" stroke-linecap="round"/>
      <polygon points="2 -7 11 0 2 7" fill="#FF8494" fill-opacity="0.35" stroke="#FF354F" stroke-width="2" stroke-linejoin="round"/>
    </g>
          <text x="48" y="16" fill="#FF8494" font-size="11" font-weight="700" letter-spacing="1">03 // MOTION &amp; DELIGHT</text>
          <text x="48" y="34" fill="#F8FAFC" font-size="16" font-weight="700">Motion &amp; Interaction</text>
        </g>
        <g transform="translate(20, 92)" fill="#94A3B8" font-size="12" font-weight="400">
          <text x="0" y="0">Bringing static layouts alive through thoughtful SVG motion,</text>
          <text x="0" y="20">CSS transitions, and micro-delights that guide user focus</text>
          <text x="0" y="40">without harming execution or framerates.</text>
        </g>
        <g transform="translate(20, 160)">
          <rect x="0" y="0" width="75" height="22" rx="6" fill="#1A2748"/>
          <text x="37" y="15" text-anchor="middle" fill="#FF8494" font-size="10.5" font-weight="600">CSS3/SMIL</text>
          <rect x="83" y="0" width="92" height="22" rx="6" fill="#1A2748"/>
          <text x="129" y="15" text-anchor="middle" fill="#FF8494" font-size="10.5" font-weight="600">Animations</text>
          <rect x="183" y="0" width="98" height="22" rx="6" fill="#1A2748"/>
          <text x="232" y="15" text-anchor="middle" fill="#FF8494" font-size="10.5" font-weight="600">Tailwind CSS</text>
        </g>
      </g>

      <!-- SLIDE 4: Performance and Production Quality -->
      <g class="about-s4 about-font">
        <rect x="0" y="0" width="347" height="195" rx="12" fill="#111B34" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2"/>
        <g transform="translate(20, 28)">
          <rect x="0" y="0" width="36" height="36" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.35" stroke-width="1"/>
          <g transform="translate(18, 18)">
      <!-- Performance Gauge / Speedometer Icon -->
      <path d="M -8.5 6 A 10.5 10.5 0 1 1 8.5 6" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="2" x2="6" y2="-5" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="2" r="2.2" fill="#10B981"/>
      <line x1="6.5" y1="-3" x2="8.5" y2="-4.2" stroke="#34D399" stroke-width="1.6" stroke-linecap="round"/>
    </g>
          <text x="48" y="16" fill="#10B981" font-size="11" font-weight="700" letter-spacing="1">04 // PRODUCTION QUALITY</text>
          <text x="48" y="34" fill="#F8FAFC" font-size="16" font-weight="700">Performance &amp; Scale</text>
        </g>
        <g transform="translate(20, 92)" fill="#94A3B8" font-size="12" font-weight="400">
          <text x="0" y="0">Obsessing over bundle size, Core Web Vitals, clean semantic</text>
          <text x="0" y="20">HTML markup, and modern developer tooling. Delivering</text>
          <text x="0" y="40">rock-solid interfaces ready for real-world deployments.</text>
        </g>
        <g transform="translate(20, 160)">
          <rect x="0" y="0" width="85" height="22" rx="6" fill="#1A2748"/>
          <text x="42" y="15" text-anchor="middle" fill="#10B981" font-size="10.5" font-weight="600">Web Vitals</text>
          <rect x="93" y="0" width="80" height="22" rx="6" fill="#1A2748"/>
          <text x="133" y="15" text-anchor="middle" fill="#10B981" font-size="10.5" font-weight="600">Git/GitHub</text>
          <rect x="181" y="0" width="70" height="22" rx="6" fill="#1A2748"/>
          <text x="216" y="15" text-anchor="middle" fill="#10B981" font-size="10.5" font-weight="600">Clean Code</text>
        </g>
      </g>
    </g>

    <!-- Carousel Progress Dots / Indicators -->
    <g transform="translate(160, 292)">
      <rect x="0" y="0" width="8" height="6" rx="3" fill="#334155" class="about-p1"/>
      <rect x="16" y="0" width="8" height="6" rx="3" fill="#334155" class="about-p2"/>
      <rect x="32" y="0" width="8" height="6" rx="3" fill="#334155" class="about-p3"/>
      <rect x="48" y="0" width="8" height="6" rx="3" fill="#334155" class="about-p4"/>
    </g>
  </g>
</svg>